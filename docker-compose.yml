services:
  orchid-api:
    container_name: orchid-api
    build:
      context: .
      dockerfile: OrchidCapitalCoreAPI/Dockerfile
    ports:
      - "5001:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081 
      DB_NAME: "OrchidCapital"
      DB-CONN-STR: "Server=192.168.29.136,1433;Database={{DBNAME}};User Id=sa;Password=sa@123;TrustServerCertificate=True;Encrypt=False"
      USR_ENC_KEY: "ORCHIDCAPITAL@2026"

  orchid-dashboard:
    container_name: orchid-dashboard
    build:
      context: .
      dockerfile: OrchidCapital/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - orchid-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_NAME: "OrchidCapital"
      DB-CONN-STR: "Server=192.168.29.136,1433;Database={{DBNAME}};User Id=sa;Password=sa@123;TrustServerCertificate=True;Encrypt=False"
      OrchidCoreAPIurl: "http://orchid-api:8081/api/ORCHIDCAPITAL/v1/"
      USR_ENC_KEY: "ORCHIDCAPITAL@2026"