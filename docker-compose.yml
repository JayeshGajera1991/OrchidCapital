services:
  orchid-api:
    container_name: orchid-api
    build:
      context: .
      dockerfile: OrchidCapitalCoreAPI/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Replace DefaultConnection with your actual key from appsettings.json.
      # Replace database name, SQL username, and password with your current values.
      ConnectionStrings__DefaultConnection: "Server=DESKTOP-GMTUJA5\\JAYESH;Database=OrchidCapital;User Id=sa;Password=sa@123;TrustServerCertificate=True;MultipleActiveResultSets=True"

  orchid-dashboard:
    container_name: orchid-dashboard
    build:
      context: .
      dockerfile: OrchidCapital/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Same database connection as the API, if the MVC project also accesses SQL Server.
      ConnectionStrings__DefaultConnection: "Server=DESKTOP-GMTUJA5\\JAYESH;Database=OrchidCapital;User Id=sa;Password=sa@123;TrustServerCertificate=True;MultipleActiveResultSets=True"

      # Use this address when the MVC project calls the API from inside Docker.
      ApiSettings__BaseUrl: "http://orchid-api:8080"
    depends_on:
      - orchid-api