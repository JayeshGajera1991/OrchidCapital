services:
  orchid-api:
    container_name: orchid-api
    build:
      context: .
      dockerfile: OrchidCapitalCoreAPI/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB-CONN-STR: "Data Source=mssql-db,1433;Initial Catalog={{DBNAME}};User Id=sa;Password=Sa@12345;TrustServerCertificate=True;MultipleActiveResultSets=True"
      DB_NAME: "OrchidCapital"
      USR_ENC_KEY: "ORCHIDCAPITAL@2026"
    volumes:
      - ./docker/dataprotection-keys:/root/.aspnet/DataProtection-Keys

  orchid-dashboard:
    container_name: orchid-dashboard
    build:
      context: .
      dockerfile: OrchidCapital/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=mssql-db,1433;Database=OrchidCapital;User Id=sa;Password=Sa@12345;TrustServerCertificate=True;MultipleActiveResultSets=True"
      OrchidCoreAPIurl: "http://orchid-api:8080/api/ORCHIDCAPITAL/v1/"
      ApiSettings__BaseUrl: "http://orchid-api:8080"

      # Required by LoginController
      USR_ENC_KEY: "ORCHIDCAPITAL@2026"
    depends_on:
      - orchid-api
    volumes:
      - ./docker/dataprotection-keys:/root/.aspnet/DataProtection-Keys

  mssql-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Sa@12345"
    ports:
      - "1433:1433"
    volumes:
      - ./docker/mssql-backup:/var/opt/mssql/backup
      - ./docker/mssql-data:/var/opt/mssql/data
    # removed healthcheck that relied on missing mssql-tools in image